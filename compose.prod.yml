services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: buechijonas/govex-backend:latest
    profiles: [migration]

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      AUTHENTIK_URL: http://authentik-server:9000
      GOVEX_MIGRATION_TOKEN: ${GOVEX_MIGRATION_TOKEN:-}

    depends_on:
      db:
        condition: service_healthy
      authentik-server:
        condition: service_healthy

  authentik-db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}

    volumes:
      - authentik_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-server: &authentik
    image: buechijonas/govex-authentik:latest
    restart: unless-stopped
    command: server
    shm_size: 512mb

    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?see .env.example}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 172.30.0.10/32
      AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_ERROR_REPORTING__SEND_PII: "false"
      AUTHENTIK_LOG_LEVEL: info
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-}
      GOVEX_WINTERSEHN_CLIENT_ID: ${WINTERSEHN_CLIENT_ID}
      GOVEX_WINTERSEHN_CLIENT_SECRET: ${WINTERSEHN_CLIENT_SECRET}
      GOVEX_WINTERSEHN_REDIRECT_URI: ${WINTERSEHN_REDIRECT_URI}
      GOVEX_WINTERSEHN_LAUNCH_URL: ${WINTERSEHN_LAUNCH_URL:-}
      GOVEX_WINTERSEHN_ACCOUNT_DELETED_URL: ${WINTERSEHN_ACCOUNT_DELETED_URL:?see .env.example}
      GOVEX_CAPTCHA_PUBLIC_KEY: ${CAPTCHA_PUBLIC_KEY:-}
      GOVEX_CAPTCHA_PRIVATE_KEY: ${CAPTCHA_PRIVATE_KEY:-}
      GOVEX_NETWORK_BINDING: ${SESSION_NETWORK_BINDING:-no_binding}
      GOVEX_GEOIP_BINDING: ${SESSION_GEOIP_BINDING:-bind_continent}
      GOVEX_MIGRATION_TOKEN: ${GOVEX_MIGRATION_TOKEN:-}

    depends_on:
      authentik-db:
        condition: service_healthy

  authentik-worker:
    <<: *authentik
    command: worker

  origin:
    image: buechijonas/govex-proxy:latest
    restart: unless-stopped

    networks:
      default:
        ipv4_address: 172.30.0.10

    depends_on:
      authentik-server:
        condition: service_healthy

  anubis:
    image: ghcr.io/techarohq/anubis:v1.27.0
    restart: unless-stopped

    environment:
      BIND: ":3000"
      TARGET: "http://origin:80"
      METRICS_BIND: ":9090"
      SERVE_ROBOTS_TXT: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}

    depends_on:
      - origin

  edge:
    image: buechijonas/govex-proxy:latest
    restart: unless-stopped

    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.edge", "--adapter", "caddyfile"]

    ports:
      - "80:80"
      - "443:443"

    environment:
      DOMAIN: ${DOMAIN}
      ACCOUNT_DOMAIN: ${ACCOUNT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_IPS: ${ADMIN_IPS:?see .env.example}

    volumes:
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - anubis

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  authentik_data:
  caddy_data:
  caddy_config:
