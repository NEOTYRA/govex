services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: govex
      POSTGRES_USER: govex
      POSTGRES_PASSWORD: govex

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govex -d govex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py createcachetable &&
      python manage.py bootstrap_admin &&
      python manage.py bootstrap_client &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./backend:/app

    ports:
      - "8001:8000"

    environment:
      DB_NAME: govex
      DB_USER: govex
      DB_PASSWORD: govex
      DB_HOST: db
      DB_PORT: 5432
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@govex.ch
      ADMIN_PASSWORD: admin
      # host.docker.internal: wintersehn's backend container reaches govex
      # through it for the server-to-server token/userinfo exchange.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,host.docker.internal
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      FRONTEND_LOGIN_URL: http://localhost:5174/login
      # Local dev registration of wintersehn as a trusted OIDC client.
      # wintersehn's own compose.yml points GOVEX_CLIENT_ID/SECRET at the
      # same values via http://host.docker.internal:8001.
      CLIENT_NAME: wintersehn (dev)
      CLIENT_ID: wintersehn-dev
      CLIENT_SECRET: wintersehn-dev-secret
      CLIENT_REDIRECT_URI: http://localhost:8000/api/auth/oidc/callback/

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "5174:5173"

    environment:
      VITE_API_URL: http://localhost:8001

    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
