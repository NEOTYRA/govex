services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: govex
      POSTGRES_USER: govex
      POSTGRES_PASSWORD: govex

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govex -d govex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    profiles: [migration]
    command: python manage.py migrate_to_authentik

    volumes:
      - ./backend:/app

    environment:
      DB_NAME: govex
      DB_USER: govex
      DB_PASSWORD: govex
      DB_HOST: db
      DB_PORT: 5432
      AUTHENTIK_URL: http://authentik-server:9000
      GOVEX_MIGRATION_TOKEN: govex-dev-migration-token

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "5174:5173"

    depends_on:
      - authentik-server

  authentik-db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik

    volumes:
      - authentik_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-server: &authentik
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: server
    shm_size: 512mb

    environment:
      AUTHENTIK_SECRET_KEY: govex-dev-authentik-secret-key-do-not-use-in-prod
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@govex.ch
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
      AUTHENTIK_BOOTSTRAP_TOKEN: govex-dev-bootstrap-token
      GOVEX_WINTERSEHN_CLIENT_ID: wintersehn-dev
      GOVEX_WINTERSEHN_CLIENT_SECRET: wintersehn-dev-secret
      GOVEX_WINTERSEHN_REDIRECT_URI: http://localhost:8000/api/auth/oidc/callback/
      GOVEX_MIGRATION_TOKEN: govex-dev-migration-token

    volumes:
      - ./authentik/blueprints:/blueprints/govex:ro

    ports:
      - "127.0.0.1:9000:9000"

    depends_on:
      authentik-db:
        condition: service_healthy

  authentik-worker:
    <<: *authentik
    command: worker
    ports: []

volumes:
  postgres_data:
  frontend_node_modules:
  authentik_data:
