version: 1
metadata:
  name: govex
entries:

  - model: authentik_policies_password.passwordpolicy
    id: password-policy
    identifiers:
      name: govex-password-policy
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 15
      amount_digits: 0
      amount_uppercase: 0
      amount_lowercase: 0
      amount_symbols: 0
      check_have_i_been_pwned: true
      hibp_allowed_count: 0
      check_zxcvbn: false
      error_message: Das Passwort muss mindestens 15 Zeichen lang sein.

  - model: authentik_policies_expression.expressionpolicy
    id: unique-email-policy
    identifiers:
      name: govex-unique-email
    attrs:
      expression: |
        from authentik.core.models import User

        email = (request.context.get("prompt_data", {}).get("email") or "").strip()
        if not email:
            ak_message("Email darf nicht leer sein.")
            return False
        others = User.objects.filter(email__iexact=email)
        if request.user.is_authenticated:
            others = others.exclude(pk=request.user.pk)
        if others.exists():
            ak_message("Zu dieser Email existiert bereits ein Konto.")
            return False
        return True

  - model: authentik_policies_reputation.reputationpolicy
    id: low-reputation-policy
    identifiers:
      name: govex-low-reputation
    attrs:
      check_ip: true
      check_username: false
      threshold: -5

  - model: authentik_policies_expression.expressionpolicy
    id: deny-policy
    identifiers:
      name: govex-deny
    attrs:
      expression: return False

  - model: authentik_stages_captcha.captchastage
    id: captcha
    conditions:
      - !Env [GOVEX_CAPTCHA_PUBLIC_KEY, ""]
    identifiers:
      name: govex-captcha
    attrs:
      public_key: !Env [GOVEX_CAPTCHA_PUBLIC_KEY, ""]
      private_key: !Env [GOVEX_CAPTCHA_PRIVATE_KEY, ""]
      js_url: https://challenges.cloudflare.com/turnstile/v0/api.js
      api_url: https://challenges.cloudflare.com/turnstile/v0/siteverify
      interactive: true

  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: webauthn-setup
    identifiers:
      name: govex-webauthn-setup
    attrs:
      friendly_name: Passkey
      user_verification: required
      resident_key_requirement: preferred
      max_attempts: 5

  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: totp-setup
    identifiers:
      name: govex-totp-setup
    attrs:
      friendly_name: Authenticator-App
      digits: "6"

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: webauthn-validate
    identifiers:
      name: govex-webauthn-validate
    attrs:
      device_classes:
        - webauthn
        - totp
      not_configured_action: configure
      configuration_stages:
        - !KeyOf webauthn-setup
        - !KeyOf totp-setup
      webauthn_user_verification: required
      last_auth_threshold: seconds=0

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: govex-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5
      allow_show_password: false

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: govex-identification
    attrs:
      user_fields:
        - username
        - email
      password_stage: !KeyOf password
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: false
      show_source_labels: false
      enable_remember_me: false
      sources: []

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: govex-login
    attrs:
      session_duration: seconds=0
      remember_me_offset: seconds=0
      remember_device: seconds=0
      terminate_other_sessions: true
      network_binding: !Env [GOVEX_NETWORK_BINDING, no_binding]
      geoip_binding: !Env [GOVEX_GEOIP_BINDING, no_binding]

  - model: authentik_stages_user_logout.userlogoutstage
    id: logout
    identifiers:
      name: govex-logout

  - model: authentik_stages_prompt.prompt
    id: field-username
    identifiers:
      name: govex-field-username
    attrs:
      field_key: username
      label: Benutzername
      type: username
      required: true
      placeholder: Benutzername
      placeholder_expression: false
      initial_value: |
        try:
            return user.username
        except Exception:
            return ""
      initial_value_expression: true
      order: 0

  - model: authentik_stages_prompt.prompt
    id: field-email
    identifiers:
      name: govex-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      initial_value: |
        try:
            return user.email
        except Exception:
            return ""
      initial_value_expression: true
      order: 1

  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: govex-field-password
    attrs:
      field_key: password
      label: Passwort
      type: password
      required: true
      placeholder: Passwort
      placeholder_expression: false
      order: 10

  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: govex-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Passwort wiederholen
      type: password
      required: true
      placeholder: Passwort wiederholen
      placeholder_expression: false
      order: 11

  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt
    identifiers:
      name: govex-enrollment-prompt
    attrs:
      fields:
        - !KeyOf field-username
        - !KeyOf field-email
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !KeyOf password-policy
        - !KeyOf unique-email-policy

  - model: authentik_stages_prompt.promptstage
    id: profile-prompt
    identifiers:
      name: govex-profile-prompt
    attrs:
      fields:
        - !KeyOf field-username
        - !KeyOf field-email
      validation_policies:
        - !KeyOf unique-email-policy

  - model: authentik_stages_prompt.promptstage
    id: password-change-prompt
    identifiers:
      name: govex-password-change-prompt
    attrs:
      fields:
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !KeyOf password-policy

  - model: authentik_stages_user_write.userwritestage
    id: user-create
    identifiers:
      name: govex-user-create
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      user_type: internal
      user_path_template: govex

  - model: authentik_stages_user_write.userwritestage
    id: user-update
    identifiers:
      name: govex-user-update
    attrs:
      user_creation_mode: never_create

  - model: authentik_flows.flow
    id: authentication-flow
    identifiers:
      slug: govex-authentication
    attrs:
      name: govex - Anmelden
      title: Anmelden
      designation: authentication
      authentication: none
      denied_action: message

  - model: authentik_flows.flowstagebinding
    id: authentication-captcha-binding
    conditions:
      - !Env [GOVEX_CAPTCHA_PUBLIC_KEY, ""]
    identifiers:
      stage: !KeyOf captcha
      target: !KeyOf authentication-flow
      order: 5
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    conditions:
      - !Env [GOVEX_CAPTCHA_PUBLIC_KEY, ""]
    identifiers:
      policy: !KeyOf low-reputation-policy
      target: !KeyOf authentication-captcha-binding
      order: 0

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf identification
      target: !KeyOf authentication-flow
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf webauthn-validate
      target: !KeyOf authentication-flow
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf login
      target: !KeyOf authentication-flow
      order: 100

  - model: authentik_flows.flow
    id: enrollment-flow
    identifiers:
      slug: govex-enrollment
    attrs:
      name: govex - Registrieren
      title: Konto erstellen
      designation: enrollment
      authentication: require_unauthenticated
      denied_action: message

  - model: authentik_flows.flowstagebinding
    conditions:
      - !Env [GOVEX_CAPTCHA_PUBLIC_KEY, ""]
    identifiers:
      stage: !KeyOf captcha
      target: !KeyOf enrollment-flow
      order: 5

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf enrollment-prompt
      target: !KeyOf enrollment-flow
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf user-create
      target: !KeyOf enrollment-flow
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf webauthn-validate
      target: !KeyOf enrollment-flow
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf login
      target: !KeyOf enrollment-flow
      order: 100

  - model: authentik_flows.flow
    id: profile-flow
    identifiers:
      slug: govex-profile
    attrs:
      name: govex - Profil
      title: Profil bearbeiten
      designation: stage_configuration
      authentication: require_authenticated
      denied_action: message

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf webauthn-validate
      target: !KeyOf profile-flow
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf profile-prompt
      target: !KeyOf profile-flow
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf user-update
      target: !KeyOf profile-flow
      order: 30

  - model: authentik_flows.flow
    id: password-change-flow
    identifiers:
      slug: govex-password-change
    attrs:
      name: govex - Passwort ändern
      title: Passwort ändern
      designation: stage_configuration
      authentication: require_authenticated
      denied_action: message

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf webauthn-validate
      target: !KeyOf password-change-flow
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf password-change-prompt
      target: !KeyOf password-change-flow
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf user-update
      target: !KeyOf password-change-flow
      order: 30

  - model: authentik_flows.flow
    id: passkey-add-flow
    identifiers:
      slug: govex-passkey-add
    attrs:
      name: govex - Passkey hinzufügen
      title: Passkey hinzufügen
      designation: stage_configuration
      authentication: require_authenticated
      denied_action: message

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf webauthn-validate
      target: !KeyOf passkey-add-flow
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf webauthn-setup
      target: !KeyOf passkey-add-flow
      order: 20

  - model: authentik_flows.flow
    id: totp-add-flow
    identifiers:
      slug: govex-totp-add
    attrs:
      name: govex - Authenticator-App einrichten
      title: Authenticator-App einrichten
      designation: stage_configuration
      authentication: require_authenticated
      denied_action: message

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf webauthn-validate
      target: !KeyOf totp-add-flow
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf totp-setup
      target: !KeyOf totp-add-flow
      order: 20

  - model: authentik_flows.flow
    id: logout-flow
    identifiers:
      slug: govex-logout
    attrs:
      name: govex - Abmelden
      title: Abmelden
      designation: invalidation
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers:
      stage: !KeyOf logout
      target: !KeyOf logout-flow
      order: 10

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf deny-policy
      target: !Find [authentik_policies.policybindingmodel, [flow__slug, default-authentication-flow]]
      order: -100

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf deny-policy
      target: !Find [authentik_policies.policybindingmodel, [flow__slug, default-user-settings-flow]]
      order: -100

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf deny-policy
      target: !Find [authentik_policies.policybindingmodel, [flow__slug, default-password-change]]
      order: -100

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      branding_title: govex
      flow_authentication: !KeyOf authentication-flow
      flow_invalidation: !KeyOf logout-flow
      flow_user_settings: !KeyOf profile-flow

  - model: authentik_providers_oauth2.scopemapping
    id: govex-scope
    identifiers:
      name: govex-legacy-id
    attrs:
      scope_name: govex
      description: govex Benutzer-ID (Migration)
      expression: |
        govex_id = request.user.attributes.get("govex_id")
        return {"govex_id": govex_id} if govex_id is not None else {}

  - model: authentik_providers_oauth2.scopemapping
    id: govex-meta-scope
    identifiers:
      name: govex-meta
    attrs:
      scope_name: govex_meta
      description: Vorname, Nachname, Geburtsdatum, Profilbild und Vertragsstatus
      expression: |
        settings = request.user.attributes.get("settings", {})
        return {"meta": settings.get("meta", {}), "attestations": settings.get("attestations", {})}

  - model: authentik_providers_oauth2.oauth2provider
    id: wintersehn-provider
    identifiers:
      name: wintersehn
    attrs:
      client_type: confidential
      client_id: !Env GOVEX_WINTERSEHN_CLIENT_ID
      client_secret: !Env GOVEX_WINTERSEHN_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Env GOVEX_WINTERSEHN_REDIRECT_URI
      grant_types:
        - authorization_code
      sub_mode: user_uuid
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authentication_flow: !KeyOf authentication-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf govex-scope
        - !KeyOf govex-meta-scope

  - model: authentik_core.application
    identifiers:
      slug: wintersehn
    attrs:
      name: wintersehn
      provider: !KeyOf wintersehn-provider
      policy_engine_mode: any
      meta_launch_url: !Env [GOVEX_WINTERSEHN_LAUNCH_URL, ""]

  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: match-login-failed
    identifiers:
      name: govex-match-login-failed
    attrs:
      action: login_failed

  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: match-suspicious
    identifiers:
      name: govex-match-suspicious-request
    attrs:
      action: suspicious_request

  - model: authentik_events.notificationrule
    id: security-notifications
    identifiers:
      name: govex-security-events
    attrs:
      severity: warning
      destination_group: !Find [authentik_core.group, [name, authentik Admins]]
      transports:
        - !Find [authentik_events.notificationtransport, [name, default-email-transport]]
        - !Find [authentik_events.notificationtransport, [name, default-local-transport]]

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf security-notifications
      policy: !KeyOf match-login-failed
    attrs:
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf security-notifications
      policy: !KeyOf match-suspicious
    attrs:
      order: 1
